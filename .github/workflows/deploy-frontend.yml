name: Deploy Frontend to EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - "wallet-react/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wallet-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wallet-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create production env
        run: |
          echo "VITE_KAKAO_JS_KEY=${{ secrets.VITE_KAKAO_JS_KEY }}" > .env.production
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.production

      - name: Build
        run: npm run build

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "wallet-react/dist/*"
          target: "/home/${{ secrets.EC2_USER }}/deploy-temp"

      - name: Deploy on EC2 and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo rsync -av --delete /home/${{ secrets.EC2_USER }}/deploy-temp/wallet-react/dist/ /var/www/wallet-react/
            sudo systemctl reload nginx
            rm -rf /home/${{ secrets.EC2_USER }}/deploy-temp
