# 로컬: profile=local + application-local.properties (비밀번호)
spring.datasource.url=jdbc:mariadb://localhost:3306/test?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=yooned1357@
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

server.port=8080
spring.application.name=poormoney-api
server.error.include-message=always

# JWT (개발 기본값, 운영에서는 반드시 환경변수/시크릿으로 교체)
app.jwt.issuer=wallet-keeper
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_CHANGE_ME
app.jwt.access-token-ttl-seconds=86400

# CORS (프론트 개발 서버 기본)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
